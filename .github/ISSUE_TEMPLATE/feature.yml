name: Feature request
description: Propose a focused configuration-format improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: Which real configuration format or comparison case is unsupported? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed behavior, description: Explain parsing boundaries and ambiguous cases. }
    validations: { required: true }
